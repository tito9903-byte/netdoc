name: Apply profile route registration

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: netdoc-profile-registration
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/access-control-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/access-control-audit
          fetch-depth: 0

      - name: Register profile module
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/profile-register.patch
          git apply --check .github/profile-register.patch
          git apply .github/profile-register.patch
          rm .github/profile-register.patch
          git add app/main.py app/core/auth.py app/templates/base.html .github/profile-register.patch
          git diff --cached --check
          git config user.name "NetDoc Automation"
          git config user.email "netdoc-automation@users.noreply.github.com"
          git commit -m "feat: register self-service profile"
          git push origin HEAD:feature/access-control-audit
