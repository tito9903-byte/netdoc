name: Apply login throttle update

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: netdoc-login-throttle
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/access-control-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/access-control-audit
          fetch-depth: 0

      - name: Apply login throttle
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/login-throttle.patch
          git apply --check .github/login-throttle.patch
          git apply .github/login-throttle.patch
          rm .github/login-throttle.patch
          git add \
            .env.example \
            app/core/config.py \
            app/services/access_service.py \
            app/main.py \
            tests/test_access_control.py \
            tests/test_admin_routes.py \
            .github/login-throttle.patch
          git diff --cached --check
          git config user.name "NetDoc Automation"
          git config user.email "netdoc-automation@users.noreply.github.com"
          git commit -m "feat: throttle repeated login failures"
          git push origin HEAD:feature/access-control-audit
