name: Apply access control batch

on:
  push:
    branches:
      - feature/access-control-audit
    paths:
      - .github/patches/apply.marker
      - .github/workflows/apply-access-control-batch.yml

permissions:
  contents: write

concurrency:
  group: netdoc-access-control-batch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/access-control-audit
          fetch-depth: 0

      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/chunk-* > /tmp/netdoc-patch.b64
          base64 --decode /tmp/netdoc-patch.b64 | gzip --decompress > /tmp/netdoc.patch
          git apply --check /tmp/netdoc.patch
          git apply /tmp/netdoc.patch
          rm -rf .github/patches
          rm -f .github/workflows/apply-access-control-batch.yml
          git add -A
          git diff --cached --check

      - name: Commit batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NetDoc Automation"
          git config user.email "netdoc-automation@users.noreply.github.com"
          git commit -m "feat: add global search system health and admin controls"
          git push origin HEAD:feature/access-control-audit
