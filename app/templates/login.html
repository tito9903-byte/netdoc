<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | NetDoc</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/auth.css') }}"
    >
</head>

<body class="login-body">
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
                <div class="brand-symbol">N</div>

                <div>
                    <strong>NetDoc</strong>
                    <span>Documentación de red</span>
                </div>
            </div>

            <div class="login-heading">
                <h1>Iniciar sesión</h1>

                <p>
                    Accede a la plataforma de consulta y
                    documentación de infraestructura.
                </p>
            </div>

            {% if error %}
                <div class="login-error">
                    {{ error }}
                </div>
            {% endif %}

            <form
                class="login-form"
                method="post"
                action="/login"
            >
                <input
                    type="hidden"
                    name="next_url"
                    value="{{ next_url }}"
                >

                <div class="login-field">
                    <label for="username">
                        Usuario
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="login-field">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    class="login-button"
                    type="submit"
                >
                    Entrar a NetDoc
                </button>
            </form>

            <div class="login-footer">
                <span class="status-dot online"></span>
                <span>Servicio NetDoc disponible</span>
            </div>
        </section>
    </main>
</body>
</html>
