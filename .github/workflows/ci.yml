name: NetDoc CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      NETBOX_URL: https://netbox.invalid
      NETBOX_TOKEN: ci-placeholder-token
      NETBOX_TOKEN_TYPE: token
      NETBOX_VERIFY_SSL: "false"
      NETBOX_WRITE_ENABLED: "false"
      SESSION_SECRET: ci-session-secret-not-for-production
      SESSION_COOKIE_NAME: netdoc_ci_session
      ADMIN_USERNAME: admin
      DATABASE_URL: sqlite:///./data/ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Prepare CI password hash
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from argon2 import PasswordHasher
          print("ADMIN_PASSWORD_HASH=" + PasswordHasher().hash("AdminPassword123"))
          PY

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Import application
        run: python -c 'from app.main import app; print(app.title, len(app.routes))'

      - name: Parse templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          root = Path("app/templates")
          environment = Environment(loader=FileSystemLoader(root))
          for template in sorted(root.glob("*.html")):
              environment.get_template(template.name)
              print(template.name)
          PY

      - name: Validate deployment scripts
        run: |
          bash -n scripts/netdoc-deploy-dev
          bash -n scripts/netdoc-deploy-prod
          test -x scripts/netdoc-deploy-dev
          test -x scripts/netdoc-deploy-prod

      - name: Package validated source
        run: |
          tar \
            --exclude=.git \
            --exclude=data \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            -czf netdoc-source.tgz \
            .

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: netdoc-source-${{ github.sha }}
          path: netdoc-source.tgz
          retention-days: 3
          if-no-files-found: error
